<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111522">
  <meta name="description" content="Your personal Oscar contenders watchlist, rankings, and movie suggestions.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Oscar Watchlist 2027</title>
  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="page-glow" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="app-header">
      <div class="brandline"><span class="brand-mark" aria-hidden="true">✦</span><span>THE WATCHLIST <span class="brand-separator">/</span> 2027</span></div>
      <div class="headline-row">
        <div>
          <h1>Oscar <em>Watchlist</em></h1>
          <p class="header-subtitle">Your awards-season viewing, ranked your way.</p>
        </div>
        <button id="settingsBtn" class="icon-button top-settings" aria-label="Open settings and backups" title="Settings and backups">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg>
        </button>
      </div>
      <div class="summary-panel" aria-label="Overall watchlist summary">
        <div class="summary-item"><strong id="totalCount">28</strong><span>Total films</span></div>
        <div class="summary-divider"></div>
        <div class="summary-item"><strong id="remainingCount">28</strong><span>To watch</span></div>
        <div class="summary-divider"></div>
        <div class="summary-item"><strong id="watchedCount">0</strong><span>Watched</span></div>
        <div class="summary-meter" aria-hidden="true"><div id="progressFill"></div></div>
      </div>
    </header>

    <section class="control-panel" aria-label="Watchlist controls">
      <div class="section-caption"><span class="small-gold-line" aria-hidden="true"></span>EXPLORE YOUR LIST</div>
      <div class="category-bar">
        <label class="sr-only" for="categorySelect">Oscar category</label>
        <div class="select-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l1 4 4 2v2c0 4-4 7-9 8-5-1-9-4-9-8v-2l4-2 1-4z"/><path d="M9 8h6M12 7v8"/></svg>
          <select id="categorySelect" aria-label="Oscar category"><option value="all">All Movies</option></select>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </div>
        <button class="add-button" id="addMovieBtn" aria-label="Add movie"><span>＋</span><span class="add-label">Add Movie</span></button>
      </div>
      <div class="filter-row" id="filters" role="group" aria-label="Watch status filter">
        <button class="filter-chip active" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-chip" data-filter="unwatched" aria-pressed="false">Unwatched</button>
        <button class="filter-chip" data-filter="watched" aria-pressed="false">Watched</button>
        <button class="filter-chip available-chip" data-filter="available" aria-pressed="false"><span class="live-dot"></span>Available now</button>
      </div>
      <div class="list-heading"><span id="listContext">All 28 films</span><span class="order-hint" id="orderHint">Drag <span aria-hidden="true">⠿</span> to rank</span></div>
    </section>

    <section id="movieList" class="movie-list" aria-live="polite" aria-label="Ranked movie list"></section>
    <footer class="page-footer"><span>✦</span> A PERSONAL CINEMA COMPANION <span>✦</span></footer>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-backdrop" data-close-modal="true"></div>
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"></section>
  </div>
  <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
  <input type="file" id="backupFile" accept=".json,application/json" hidden>
</body>
</html>
